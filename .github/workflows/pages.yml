name: Publish PULSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Locate standalone or nested PULSE
        run: |
          if [ -f pulse/package.json ]; then echo 'PULSE_DIR=pulse' >> "$GITHUB_ENV"; else echo 'PULSE_DIR=.' >> "$GITHUB_ENV"; fi
      - run: npm ci
        working-directory: ${{ env.PULSE_DIR }}
      - run: npm test
        working-directory: ${{ env.PULSE_DIR }}
      - run: npm run build
        working-directory: ${{ env.PULSE_DIR }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PULSE_DIR }}/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
