name: Build PULSE Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: npm run android:verify
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable test APK and unsigned Play bundle
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug bundleRelease
      - name: Package downloads
        run: |
          mkdir android-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifacts/PULSE-teste.apk
          cp android/app/build/outputs/bundle/release/app-release.aab android-artifacts/PULSE-publicacao-sem-assinatura.aab
          cp assets/play-store-icon.png android-artifacts/PULSE-icone-512.png
          cp ANDROID.md android-artifacts/LEIA-ME.md
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-Android
          path: android-artifacts/
          retention-days: 30
